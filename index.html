<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>愿望墙</title>
<script src="supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea{touch-action:manipulation}
:root{
  --bg:#fafafa;--surface:#f2f2f5;--card:#ffffff;--card-hover:#fcfcfd;
  --border:#eaeaef;--border-hover:#d4d4db;
  --text:#18181b;--text-sec:#52525b;--text-dim:#a1a1aa;
  --accent:#18181b;--accent-light:#3f3f46;--accent-bg:rgba(0,0,0,0.03);
  --green:#16a34a;--green-bg:rgba(22,163,74,0.06);
  --red:#dc2626;--red-bg:rgba(220,38,38,0.05);
  --radius:12px;--radius-lg:16px;
  --nav-h:60px;
  --shadow:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.08);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:var(--nav-h);
}
.glow{
  position:fixed;top:-40%;left:50%;transform:translateX(-50%);
  width:800px;height:600px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.02) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* ===== 登录/注册页 ===== */
.auth-page{
  position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.auth-page.hidden{display:none}
.auth-box{
  width:90%;max-width:380px;padding:40px 28px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);animation:fadeUp .5s cubic-bezier(.4,0,.2,1);
}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo h1{font-size:1.4em;color:var(--accent);letter-spacing:2px;font-weight:600}
.auth-logo p{font-size:0.82em;color:var(--text-dim);margin-top:6px}
.auth-tabs{display:flex;margin-bottom:24px;border-bottom:1px solid var(--border)}
.auth-tab{
  flex:1;padding:10px;text-align:center;font-size:0.88em;
  color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .25s;background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;
}
.auth-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.auth-form{display:none}
.auth-form.on{display:block}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:0.78em;color:var(--text-sec);margin-bottom:5px;letter-spacing:.5px}
.auth-field input{
  width:100%;padding:11px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:0.9em;outline:none;transition:border-color .3s;
}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.04)}
.auth-err{
  font-size:0.8em;color:var(--red);margin-bottom:12px;
  display:none;padding:8px 12px;background:var(--red-bg);border-radius:8px;
}
.auth-err.show{display:block}
/* ===== 主布局 ===== */
.page{animation:fadeUp .4s cubic-bezier(.4,0,.2,1)}
.app.hidden,.page.hidden,.hidden{display:none}
.container{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 20px 20px}
header{padding:30px 0 12px;text-align:center}
header h1{font-size:1.4em;font-weight:600;letter-spacing:2px;color:var(--accent);margin-bottom:6px}
header p{font-size:0.85em;color:var(--text-sec);font-weight:300}
.stats{display:flex;justify-content:center;gap:40px;padding:16px 0 24px}
.stat{text-align:center}
.stat b{display:block;font-size:1.3em;color:var(--text);font-weight:600}
.stat span{font-size:0.72em;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
.panel:hover{border-color:var(--border-hover)}
.panel-title{font-size:0.8em;font-weight:600;color:var(--text-sec);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}
input,select,textarea{
  width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font-size:0.9em;outline:none;
  transition:border-color .3s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.04)}
select option{background:var(--surface);color:var(--text)}
textarea{min-height:80px;resize:vertical;margin-bottom:4px}
::placeholder{color:var(--text-dim)}
.form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.char-count{font-size:0.75em;color:var(--text-dim)}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 20px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:transparent;color:var(--text-sec);font-size:0.85em;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);font-family:inherit;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(0.96)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.pri:hover{background:var(--accent-light);border-color:var(--accent-light)}
.btn.sm{padding:5px 12px;font-size:0.78em}
.btn.sm:active{transform:scale(0.94)}
.btn.green{border-color:var(--green);color:var(--green)}
.btn.green:hover{background:var(--green-bg)}
.btn.done{background:var(--green-bg);border-color:var(--green);color:var(--green);cursor:default;opacity:.8}
.btn.full{width:100%;justify-content:center;padding:12px}

/* 工具栏 */
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;transition:border-color .3s}
.search-box:focus-within{border-color:var(--accent)}
.search-box svg{color:var(--text-dim);flex-shrink:0}
.search-box input{border:none;background:none;padding:9px 0}
.search-box input:focus{border-color:transparent}
.toolbar select{width:auto;min-width:110px;padding:9px 12px;background:var(--card)}
.tags{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tag{padding:4px 14px;border-radius:20px;font-size:0.78em;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1)}
.tag:hover,.tag.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);transform:translateY(0)}
.card.new{animation:cardIn .35s cubic-bezier(.4,0,.2,1) both}
.card:hover{border-color:var(--border-hover);background:var(--card-hover);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.done{border-color:rgba(90,158,111,.25);background:rgba(90,158,111,.03)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-author{font-size:0.88em;font-weight:500}
.card-meta{display:flex;gap:8px;align-items:center}
.card-tag{font-size:0.7em;padding:2px 10px;border-radius:10px;background:var(--accent-bg);color:var(--accent)}
.card-city{font-size:0.7em;color:var(--text-dim)}
.card-body{color:var(--text-sec);font-size:0.9em;line-height:1.7;margin-bottom:12px;word-break:break-word}
.card-title{font-size:0.95em;font-weight:600;color:var(--text);margin-bottom:6px}
.card-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card-time{font-size:0.75em;color:var(--text-dim)}
.card-actions{display:flex;gap:6px;align-items:center}
.likes{font-size:0.8em;color:var(--text-dim);margin-right:4px}
.msg-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.msg{padding:8px 12px;margin-bottom:6px;border-radius:8px;background:var(--surface);font-size:0.82em;color:var(--text-sec)}
.msg b{color:var(--accent);font-weight:500}
.msg-input{display:flex;gap:8px;margin-top:8px}
.msg-input input{flex:1}

/* 我的页面 */
.profile-header{display:flex;align-items:center;gap:16px;padding:30px 0 20px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.2em;color:var(--text);font-weight:600;flex-shrink:0}
.profile-info h2{font-size:1.1em;font-weight:600}
.profile-info p{font-size:0.82em;color:var(--text-dim)}
.profile-stats{display:flex;gap:24px;padding:12px 0 24px;border-bottom:1px solid var(--border);margin-bottom:20px}
.section-title{font-size:0.8em;font-weight:600;color:var(--text-sec);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}

/* 编辑资料弹窗 */
.edit-profile-btn{background:none;border:none;color:var(--text-dim);font-size:0.82em;cursor:pointer;padding:2px 0}
.edit-profile-btn:hover{color:var(--accent)}
.emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.emoji-opt{width:100%;aspect-ratio:1;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:1.5em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.4,0,.2,1)}
.emoji-opt:hover{border-color:var(--accent-light);background:var(--accent-bg);transform:scale(1.08)}
.emoji-opt.on{border-color:var(--accent);background:var(--accent-bg)}
.card-avatar{margin-right:6px}

/* 底部导航 */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:rgba(255,255,255,0.85);border-top:1px solid var(--border);
  display:flex;z-index:30;box-shadow:0 -1px 8px rgba(0,0,0,0.04);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.bottom-nav.hidden{display:none !important}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;color:var(--text-dim);font-size:0.68em;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);font-family:inherit;
}
.nav-item svg{transition:all .2s cubic-bezier(.4,0,.2,1)}
.nav-item.on,.nav-item.on svg{color:var(--accent);stroke:currentColor}
.nav-item.on{transform:scale(1.05)}
.unread-dot{position:absolute;top:6px;right:50%;transform:translateX(14px);width:8px;height:8px;background:var(--red);border-radius:50%}
.unread-dot.hidden{display:none}

/* 消息页 */
.msg-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.msg-tab{flex:1;padding:10px;text-align:center;font-size:0.85em;color:var(--text-dim);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .25s;position:relative}
.msg-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.msg-tab .tab-badge{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:0.65em;background:var(--red);color:#fff;border-radius:8px;margin-left:4px;padding:0 4px}
.msg-tab .tab-badge.hidden{display:none}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background .2s}
.notif-item:hover{background:var(--accent-bg)}
.notif-item.unread{background:rgba(0,0,0,0.02)}
.notif-icon{width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1em;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:0.85em;color:var(--text-sec);line-height:1.5}
.notif-text b{color:var(--text);font-weight:500}
.notif-time{font-size:0.72em;color:var(--text-dim);margin-top:3px}
.conv-item{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;cursor:pointer;transition:background .2s}
.conv-item:hover{background:var(--accent-bg)}
.conv-avatar{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:0.88em;font-weight:500;display:flex;justify-content:space-between}
.conv-preview{font-size:0.78em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-unread{width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0}
.chat-header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.chat-back{background:none;border:none;font-size:1.2em;cursor:pointer;color:var(--text-sec);padding:4px}
.chat-name{font-size:1em;font-weight:600}
.chat-messages{min-height:200px;max-height:50vh;overflow-y:auto;padding:8px 0}
.chat-bubble{max-width:75%;padding:10px 14px;border-radius:var(--radius-lg);margin-bottom:8px;font-size:0.88em;line-height:1.6;word-break:break-word}
.chat-bubble.mine{background:var(--accent);color:var(--bg);margin-left:auto;border-bottom-right-radius:4px}
.chat-bubble.theirs{background:var(--surface);color:var(--text);border-bottom-left-radius:4px}
.chat-bubble .chat-time{font-size:0.68em;opacity:0.6;margin-top:4px;display:block}
.chat-input-bar{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:12px}
.chat-input-bar input{flex:1}
.send-dm-btn{background:none;border:none;color:var(--accent);font-size:0.82em;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit}
.send-dm-btn:hover{color:var(--text)}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.4,0,.2,1)}
.overlay.show{opacity:1;visibility:visible}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;max-width:440px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:translateY(20px) scale(.97);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1)}
.overlay.show .modal{transform:translateY(0) scale(1);opacity:1}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head span{font-size:1em;font-weight:600;color:var(--text)}
.btn-close{background:none;border:none;color:var(--text-dim);font-size:1.4em;cursor:pointer;padding:0 4px;line-height:1}
.btn-close:hover{color:var(--text)}
.empty,.loading{text-align:center;padding:40px 20px;color:var(--text-dim)}
.loading{display:block}.empty{display:none}
.empty-icon{font-size:2em;margin-bottom:8px;opacity:.4}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(200px);background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 28px;border-radius:var(--radius);font-size:0.88em;z-index:200;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s cubic-bezier(.4,0,.2,1);pointer-events:none;opacity:0;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div class="glow"></div>

<!-- ===== 登录注册页 ===== -->
<div class="auth-page hidden" id="authPage">
<div class="auth-box">
  <div class="auth-logo">
    <h1>WISH WALL</h1>
    <p></p>
  </div>
  <div class="auth-tabs">
    <button class="auth-tab on" onclick="switchAuth('login')">登录</button>
    <button class="auth-tab" onclick="switchAuth('reg')">注册</button>
  </div>
  <div class="auth-err" id="authErr"></div>
  <!-- 登录 -->
  <form class="auth-form on" id="loginForm" onsubmit="doLogin(event)">
    <div class="auth-field"><label>邮箱</label><input type="email" id="lEmail" placeholder="your@email.com" required></div>
    <div class="auth-field"><label>密码</label><input type="password" id="lPass" placeholder="输入密码" required></div>
    <button type="submit" class="btn pri full">登录</button>
  </form>
  <!-- 注册 -->
  <form class="auth-form" id="regForm" onsubmit="doReg(event)">
    <div class="auth-field"><label>昵称</label><input type="text" id="rName" placeholder="给自己取个名字" maxlength="20" required></div>
    <div class="auth-field"><label>邮箱</label><input type="email" id="rEmail" placeholder="your@email.com" required></div>
    <div class="auth-field"><label>密码</label><input type="password" id="rPass" placeholder="至少6位" minlength="6" required></div>
    <button type="submit" class="btn pri full">注册</button>
  </form>
</div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app hidden" id="app">

<!-- 首页 -->
<div class="page" id="pageHome">
<div class="container">
  <header>
    <h1>WISH WALL</h1>
    <p></p>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>愿望</span></div>
    <div class="stat"><b id="sWaiting">0</b><span>等待中</span></div>
    <div class="stat"><b id="sFulfilled">0</b><span>已实现</span></div>
  </div>
  <div class="panel">
    <div class="panel-title">许一个愿望</div>
    <input type="text" id="fTitle" placeholder="愿望标题（一句话概括）" maxlength="30" style="margin-bottom:10px">
    <textarea id="fContent" placeholder="描述你的愿望，说说原因，让好心人更了解你" maxlength="500" oninput="updateCount()"></textarea>
    <div class="form-grid">
      <select id="fCat">
        <option value="学习">学习</option><option value="生活">生活</option>
        <option value="医疗">医疗</option>
        <option value="梦想">梦想</option><option value="其他">其他</option>
      </select>
      <input type="text" id="fCity" placeholder="所在城市（选填）" maxlength="20">
    </div>
    <div class="form-grid">
      <input type="text" id="fContact" placeholder="联系方式（选填，仅认领者可见）" maxlength="60">
    </div>
    <div class="form-footer">
      <span class="char-count" id="charCount">0 / 500</span>
      <button class="btn pri" onclick="postWish()">发布愿望</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索愿望..." oninput="render()">
    </div>
    <select id="sortBy" onchange="render()">
      <option value="newest">最新发布</option><option value="oldest">最早发布</option><option value="hot">最多支持</option>
    </select>
  </div>
  <div class="tags" id="tags"></div>
  <div id="list"></div>
  <div class="loading" id="loading">加载中...</div>
  <div class="empty" id="empty"><div class="empty-icon">○</div><p>还没有愿望</p></div>
</div>
</div>

<!-- 我的 -->
<div class="page hidden" id="pageMine">
<div class="container">
  <div class="profile-header">
    <div class="avatar" id="avatarChar">匿</div>
    <div class="profile-info">
      <h2 id="profileName">用户</h2>
      <p id="profileEmail" style="font-size:0.75em;color:var(--text-dim)">ID</p>
      <button class="edit-profile-btn" onclick="openEditProfile()">编辑资料</button>
    </div>

<script>
const SUPA_URL='https://rzrbbgvfihebshalwcnq.supabase.co';

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function timeAgo(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return'刚刚';if(m<60)return m+'分钟前';
  const h=Math.floor(m/60);if(h<24)return h+'小时前';
  const d=Math.floor(h/24);if(d<30)return d+'天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}

// ===== 登录注册 =====
function switchAuth(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('on',tab==='login'?i===0:i===1));
  document.getElementById('loginForm').classList.toggle('on',tab==='login');
  document.getElementById('regForm').classList.toggle('on',tab==='reg');
  document.getElementById('authErr').classList.remove('show');
}
function showAuthErr(msg){
  const el=document.getElementById('authErr');el.textContent=msg;el.classList.add('show');
}

async function doReg(e){
  e.preventDefault();
  const name=document.getElementById('rName').value.trim();
  const email=document.getElementById('rEmail').value.trim();
  const pass=document.getElementById('rPass').value;
  if(!name){showAuthErr('请填写昵称');return;}
  const{data,error}=await db.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
  if(error){showAuthErr(error.message);return;}
  if(data.user&&!data.session){
    const{data:d2,error:e2}=await db.auth.signInWithPassword({email,password:pass});
    if(e2){showAuthErr('注册成功，请切换到登录页登录');return;}
    await db.from('profiles').upsert({user_id:d2.user.id,display_name:name,avatar_emoji:'',updated_at:Date.now()});
    enterApp(d2.user);return;
  }
  await db.from('profiles').upsert({user_id:data.user.id,display_name:name,avatar_emoji:'',updated_at:Date.now()});
  enterApp(data.user);
}

async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  const{data,error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){showAuthErr(error.message==='Invalid login credentials'?'邮箱或密码错误':error.message);return;}
  enterApp(data.user);
}

async function doLogout(){
  await db.auth.signOut();
  curUser=null;curProfile=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('bottomNav').classList.add('hidden');
  document.getElementById('authPage').classList.remove('hidden');
}

async function enterApp(user){
  curUser=user;
  const fallbackName=user.user_metadata?.display_name||user.email?.split('@')[0]||'用户';
  const shortId='ID: '+user.id.substring(0,8).toUpperCase();
  const{data:prof}=await db.from('profiles').select('*').eq('user_id',user.id).single();
  if(prof){
    curProfile={name:prof.display_name,shortId,avatar:prof.avatar_emoji||''};
  }else{
    curProfile={name:fallbackName,shortId,avatar:user.user_metadata?.avatar_emoji||''};
    await db.from('profiles').upsert({user_id:user.id,display_name:curProfile.name,avatar_emoji:curProfile.avatar,updated_at:Date.now()});
  }
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('bottomNav').classList.remove('hidden');
  document.getElementById('profileName').textContent=curProfile.name;
  document.getElementById('profileEmail').textContent=curProfile.shortId;
  document.getElementById('avatarChar').textContent=curProfile.avatar||curProfile.name.charAt(0).toUpperCase();
  loadAll();
  loadMessages();
  if(!window._msgInterval){window._msgInterval=setInterval(()=>{if(curUser)loadMessages();},10000);}
  if(!window._wishInterval){window._wishInterval=setInterval(()=>{if(curUser)loadAll();},15000);}
  startRealtime();
}

async function checkSession(){

}

function switchPage(name){
  document.getElementById('pageHome').classList.toggle('hidden',name!=='home');

async function loadAll(){
  const{data,error}=await db.from('wishes').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);toast('加载失败，请刷新');return;}
  allWishes=data||[];
  document.getElementById('loading').style.display='none';
  render();
}

function renderTags(){
  document.getElementById('tags').innerHTML=CATS.map(c=>

  ).join('');
}

async function postWish(){
  const title=document.getElementById('fTitle').value.trim();
  const content=document.getElementById('fContent').value.trim();
  if(!title){toast('给愿望取个标题吧');return;}
  if(!content){toast('写点什么再许愿吧');return;}
  if(!curUser){toast('请先登录');return;}
  const wish={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name:curProfile.name,title,
    cat:document.getElementById('fCat').value,
    content,contact:document.getElementById('fContact').value.trim(),
    city:document.getElementById('fCity').value.trim(),
    likes:0,liked_by:[],fulfilled:false,claimed_by:null,msgs:[],
    created_at:Date.now(),
    user_id:curUser.id,user_name:curProfile.name,
    user_avatar:curProfile.avatar||''
  };
  allWishes.unshift(wish);
  document.getElementById('fTitle').value='';
  document.getElementById('fContent').value='';
  document.getElementById('fContact').value='';
  document.getElementById('fCity').value='';
  updateCount();render();toast('愿望已发布');
  const{error}=await db.from('wishes').insert(wish);
  if(error){console.error('postWish error:',error);allWishes=allWishes.filter(x=>x.id!==wish.id);render();toast('发布失败：'+error.message);}
}

async function like(id){
  const w=allWishes.find(x=>x.id===id);if(!w||!curUser)return;
  const uid=curUser.id;
  const oldLikes=w.likes,oldLikedBy=[...(w.liked_by||[])];
  if(oldLikedBy.includes(uid)){w.liked_by=oldLikedBy.filter(x=>x!==uid);w.likes=Math.max(0,oldLikes-1);}
  else{w.liked_by=[...oldLikedBy,uid];w.likes=(oldLikes||0)+1;}
  render();
  const{error}=await db.rpc('update_wish',{wish_id:id,payload:{likes:w.likes,liked_by:w.liked_by}});
  if(error){console.error('like error:',error);w.likes=oldLikes;w.liked_by=oldLikedBy;render();toast('操作失败：'+error.message);}
  else if(!oldLikedBy.includes(uid)&&w.user_id!==uid){sendNotification(w.user_id,'like',id,curProfile.name+' 支持了你的愿望');}
}

async function addMsg(id){
  const inp=document.getElementById('msg_'+id);if(!inp)return;
  const text=inp.value.trim();if(!text||!curUser)return;
  const w=allWishes.find(x=>x.id===id);if(!w)return;
  const newMsg={from:curProfile.name,text,time:Date.now(),uid:curUser.id};
  const oldMsgs=[...(w.msgs||[])];
  w.msgs=[...oldMsgs,newMsg];
  inp.value='';render();
  const{error}=await db.rpc('update_wish',{wish_id:id,payload:{msgs:w.msgs}});
  if(error){w.msgs=oldMsgs;render();toast('发送失败');}
  else if(w.user_id!==curUser.id){sendNotification(w.user_id,'message',id,curProfile.name+' 给你的愿望留言了');}
}

function openClaim(id){
  const w=allWishes.find(x=>x.id===id);if(!w||w.fulfilled)return;
  if(w.user_id===curUser?.id){toast('不能认领自己的愿望哦');return;}
  claimId=id;
  document.getElementById('mTitle').textContent='认领愿望';
  document.getElementById('mBody').innerHTML=`
    ${w.title?`<p style="font-weight:600;margin-bottom:8px">${esc(w.title)}</p>`:''}
    <p style="color:var(--text-sec);margin-bottom:12px;line-height:1.7">${esc(w.content)}</p>
    <p style="color:var(--text-dim);font-size:0.85em;margin-bottom:12px">认领后可查看许愿人的联系方式</p>
    <textarea id="claimMsg" placeholder="给许愿人留句话（选填）" style="min-height:70px"></textarea>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn pri" onclick="confirmClaim()" style="flex:1">确认认领</button>
      <button class="btn" onclick="closeModal()" style="flex:1">取消</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');claimId=null;}

async function confirmClaim(){
  if(!claimId||!curUser)return;
  const w=allWishes.find(x=>x.id===claimId);if(!w){closeModal();return;}
  const msg=document.getElementById('claimMsg').value.trim();
  const oldFulfilled=w.fulfilled,oldClaimedBy=w.claimed_by,oldMsgs=[...(w.msgs||[])];
  const msgs=[...(w.msgs||[])];
  if(msg)msgs.push({from:curProfile.name,text:msg,time:Date.now(),uid:curUser.id});
  msgs.push({from:'系统',text:'这个愿望已被 '+curProfile.name+' 认领，感谢善意。',time:Date.now()});
  w.fulfilled=true;w.claimed_by=curUser.id;w.msgs=msgs;
  const contactInfo=w.contact;
  closeModal();render();toast(contactInfo?'认领成功！联系方式：'+contactInfo:'感谢你的善意');
  const{error}=await db.rpc('update_wish',{wish_id:claimId,payload:{fulfilled:true,claimed_by:curUser.id,msgs}});
  if(error){w.fulfilled=oldFulfilled;w.claimed_by=oldClaimedBy;w.msgs=oldMsgs;render();toast('认领失败');}
  else if(w.user_id!==curUser.id){sendNotification(w.user_id,'claim',claimId,curProfile.name+' 认领了你的愿望');}
}

async function delWish(id){
  const w=allWishes.find(x=>x.id===id);
  if(!w)return;
  if(w.user_id!==curUser?.id){toast('只能删除自己的愿望');return;}
  if(!confirm('确定删除这个愿望？'))return;
  const idx=allWishes.indexOf(w);
  allWishes.splice(idx,1);render();toast('已删除');
  const{error}=await db.from('wishes').delete().eq('id',id);
  if(error){allWishes.splice(idx,0,w);render();toast('删除失败');}
}

function viewDetail(id){
  const w=allWishes.find(x=>x.id===id);if(!w)return;
  const uid=curUser?.id;
  document.getElementById('mTitle').textContent='愿望详情';
  let html=`
    <div style="margin-bottom:12px">
      <span style="font-weight:500">${esc(w.name)}</span>
      <span style="color:var(--text-dim);font-size:0.8em;margin-left:8px">${esc(w.city||'')}</span>
      <span class="card-tag" style="margin-left:8px">${esc(w.cat)}</span>
      ${w.fulfilled?'<span style="color:var(--green);font-size:0.8em;margin-left:8px">✓ 已实现</span>':''}
    </div>
    ${w.title?`<p style="font-weight:600;margin-bottom:8px">${esc(w.title)}</p>`:''}
    <p style="color:var(--text-sec);line-height:1.8;margin-bottom:16px">${esc(w.content)}</p>
    ${(w.contact&&(w.user_id===uid||w.claimed_by===uid))?`<p style="color:var(--accent);font-size:0.88em;margin-bottom:12px">联系方式：${esc(w.contact)}</p>`:''}
    <p style="color:var(--text-dim);font-size:0.8em;margin-bottom:16px">${timeAgo(w.created_at)} · ${w.likes||0} 人支持</p>`;
  const msgs=w.msgs||[];
  if(msgs.length>0){
    html+=`<div style="border-top:1px solid var(--border);padding-top:12px">`;
    msgs.forEach(m=>{html+=`<div class="msg"><b>${esc(m.from)}</b>　${esc(m.text)}</div>`;});
    html+=`</div>`;
  }
  html+=`<button class="btn full" onclick="closeModal()" style="margin-top:16px">关闭</button>`;
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
}

// ===== 渲染首页列表 =====
let renderedIds=new Set();
function render(){
  const search=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  const sort=document.getElementById('sortBy')?.value||'newest';
  const uid=curUser?.id;
  let filtered=[...allWishes];
  if(curCat!=='全部')filtered=filtered.filter(w=>w.cat===curCat);
  if(search)filtered=filtered.filter(w=>((w.title||'')+w.content+w.name+(w.city||'')).toLowerCase().includes(search));
  if(sort==='oldest')filtered.reverse();
  else if(sort==='hot')filtered.sort((a,b)=>(b.likes||0)-(a.likes||0));

  document.getElementById('sTotal').textContent=allWishes.length;
  document.getElementById('sWaiting').textContent=allWishes.filter(w=>!w.fulfilled).length;
  document.getElementById('sFulfilled').textContent=allWishes.filter(w=>w.fulfilled).length;

  const list=document.getElementById('list');
  const empty=document.getElementById('empty');
  if(filtered.length===0){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  const newIds=new Set(filtered.map(w=>w.id));
  list.innerHTML=filtered.map(w=>{
    const isNew=!renderedIds.has(w.id);
    return buildCard(w,uid,true,isNew);
  }).join('');
  renderedIds=newIds;
}

function buildCard(w,uid,showDel,isNew){
  const liked=(w.liked_by||[]).includes(uid);
  const msgs=w.msgs||[];
  const isOwner=w.user_id===uid;
  const msgsHtml=`<div class="msg-section">
    ${msgs.slice(-3).map(m=>`<div class="msg"><b>${esc(m.from)}</b>　${esc(m.text)}</div>`).join('')}
    ${msgs.length>3?`<div style="font-size:.75em;color:var(--text-dim);margin-top:4px">共${msgs.length}条 · <a href="#" onclick="viewDetail('${w.id}');return false" style="color:var(--accent);text-decoration:none">查看全部</a></div>`:''}
    <div class="msg-input">
      <input id="msg_${w.id}" placeholder="留言..." onkeydown="if(event.key==='Enter')addMsg('${w.id}')">
      <button class="btn sm" onclick="addMsg('${w.id}')">发送</button>
    </div></div>`;
  return`<div class="card${w.fulfilled?' done':''}${isNew?' new':''}">
    <div class="card-top">
      <span class="card-author">${w.user_avatar?`<span class="card-avatar">${esc(w.user_avatar)}</span>`:''}${w.user_id!==uid?`<button class="send-dm-btn" onclick="event.stopPropagation();openDMFromCard('${w.user_id}','${(w.name||'用户').replace(/'/g,"\\'")}')">${esc(w.name)}</button>`:`${esc(w.name)}`}</span>
      <div class="card-meta">
        ${w.city?`<span class="card-city">${esc(w.city)}</span>`:''}
        <span class="card-tag">${esc(w.cat)}</span>
      </div>
    </div>
    ${w.title?`<div class="card-title">${esc(w.title)}</div>`:''}
    <div class="card-body">${esc(w.content)}</div>
    <div class="card-foot">
      <span class="card-time">${timeAgo(w.created_at)}</span>
      <div class="card-actions">
        <span class="likes">${w.likes||0}</span>
        <button class="btn sm${liked?' green':''}" onclick="like('${w.id}')">${liked?'♥ 已支持':'♡ 支持'}</button>
        ${w.fulfilled?'<button class="btn sm done">✓ 已实现</button>':`<button class="btn sm green" onclick="openClaim('${w.id}')">认领</button>`}
        <button class="btn sm" onclick="viewDetail('${w.id}')">详情</button>
        ${isOwner&&showDel?`<button class="btn sm" onclick="delWish('${w.id}')" style="color:var(--text-dim)">删除</button>`:''}
      </div>
    </div>
    ${msgsHtml}
  </div>`;
}

// ===== 渲染我的页面 =====
function renderMine(){
  if(!curUser)return;
  const uid=curUser.id;
  const myWishes=allWishes.filter(w=>w.user_id===uid);
  const myClaims=allWishes.filter(w=>w.claimed_by===uid);
  const myLikes=allWishes.filter(w=>(w.liked_by||[]).includes(uid));

  document.getElementById('myWishCount').textContent=myWishes.length;
  document.getElementById('myClaimCount').textContent=myClaims.length;
  document.getElementById('myLikeCount').textContent=myLikes.length;

  const wl=document.getElementById('myWishList');
  const we=document.getElementById('myEmpty');
  if(myWishes.length===0){wl.innerHTML='';we.style.display='block';}
  else{we.style.display='none';wl.innerHTML=myWishes.map(w=>buildCard(w,uid,true,false)).join('');}

  const cl=document.getElementById('myClaimList');
  const ce=document.getElementById('myClaimEmpty');
  if(myClaims.length===0){cl.innerHTML='';ce.style.display='block';}
  else{ce.style.display='none';cl.innerHTML=myClaims.map(w=>buildCard(w,uid,false,false)).join('');}
}

let allNotifs=[],allDMs=[];

async function loadMessages(){
  if(!curUser)return;
  await Promise.all([loadNotifs(),loadDMs()]);
  updateUnreadDot();
}

async function loadNotifs(){
  const{data,error}=await db.from('notifications').select('*').eq('user_id',curUser.id).order('created_at',{ascending:false}).limit(50);
  if(error){allNotifs=[];return;}
  allNotifs=data||[];
  renderNotifs();
}

async function loadDMs(){
  const{data,error}=await db.from('direct_messages').select('*').or(`from_id.eq.${curUser.id},to_id.eq.${curUser.id}`).order('created_at',{ascending:false}).limit(200);
  if(error)return;
  allDMs=data||[];
  if(curChatUser)renderChat();
  else renderConvList();
  updateUnreadDot();
}

function updateUnreadDot(){
  const unreadN=allNotifs.filter(n=>!n.read).length;
  const unreadD=allDMs.filter(m=>m.to_id===curUser.id&&!m.read).length;
  const dot=document.getElementById('unreadDot');
  dot.classList.toggle('hidden',unreadN+unreadD===0);
  const nb=document.getElementById('notifBadge');
  if(unreadN>0){nb.textContent=unreadN;nb.classList.remove('hidden');}else{nb.classList.add('hidden');}
  const db2=document.getElementById('dmBadge');
  if(unreadD>0){db2.textContent=unreadD;db2.classList.remove('hidden');}else{db2.classList.add('hidden');}
}

function switchMsgTab(tab){
  document.querySelectorAll('.msg-tab').forEach((t,i)=>t.classList.toggle('on',tab==='notif'?i===0:i===1));
  document.getElementById('notifTab').style.display=tab==='notif'?'block':'none';
  document.getElementById('dmTab').style.display=tab==='dm'?'block':'none';
  if(tab==='notif'){renderNotifs();markAllNotifsRead();}
  if(tab==='dm'){renderConvList();document.getElementById('chatView').style.display='none';}
}

async function markAllNotifsRead(){
  const unread=allNotifs.filter(n=>!n.read);
  if(unread.length===0)return;
  unread.forEach(n=>n.read=true);
  renderNotifs();updateUnreadDot();
  await db.rpc('mark_all_notifs_read',{uid:curUser.id});
}

function renderNotifs(){
  const list=document.getElementById('notifList');
  const empty=document.getElementById('notifEmpty');
  if(allNotifs.length===0){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const icons={like:'♡',claim:'✓',message:'💬',dm:'✉'};
  list.innerHTML=allNotifs.map(n=>`
    <div class="notif-item${n.read?'':' unread'}" onclick="readNotif('${n.id}','${esc(n.wish_id||'')}')">
      <div class="notif-icon">${icons[n.type]||'•'}</div>
      <div class="notif-body">
        <div class="notif-text"><b>${esc(n.from_name||'')}</b> ${esc(n.content||'')}</div>
        <div class="notif-time">${timeAgo(n.created_at)}</div>
      </div>
    </div>`).join('');
}

async function readNotif(id,wishId){
  const nid=Number(id);
  const n=allNotifs.find(x=>Number(x.id)===nid);
  if(n&&!n.read){
    n.read=true;renderNotifs();updateUnreadDot();
    const{error}=await db.rpc('update_notif_read',{nid});
    if(error)console.error('readNotif error:',error);
  }
  if(wishId){const w=allWishes.find(x=>x.id===wishId);if(w)viewDetail(wishId);}
}

async function sendNotification(userId,type,wishId,content){
  if(!curUser||userId===curUser.id)return;
  await db.from('notifications').insert({
    user_id:userId,type,wish_id:wishId,
    from_name:curProfile.name,from_id:curUser.id,
    content,read:false,created_at:Date.now()
  });
}

// ===== 私信系统 =====
let curChatUser=null;

function getConversations(){
  if(!curUser)return[];
  const convMap={};
  allDMs.forEach(m=>{
    const otherId=m.from_id===curUser.id?m.to_id:m.from_id;
    const otherName=m.from_id===curUser.id?(m.to_name||'用户'):(m.from_name||'用户');
    if(!otherId)return;
    if(!convMap[otherId]){convMap[otherId]={userId:otherId,name:otherName,lastMsg:m,unread:0};}
    if(m.to_id===curUser.id&&!m.read)convMap[otherId].unread++;
  });
  return Object.values(convMap).sort((a,b)=>b.lastMsg.created_at-a.lastMsg.created_at);
}

function renderConvList(){
  const convs=getConversations();
  const list=document.getElementById('convList');
  const empty=document.getElementById('dmEmpty');
  const chatView=document.getElementById('chatView');
  if(chatView.style.display!=='none'){updateUnreadDot();return;}
  list.style.display='block';
  if(convs.length===0){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  list.innerHTML=convs.map(c=>{
    const safeName=esc(c.name||'用户');
    const safeNameAttr=(c.name||'用户').replace(/'/g,"\\'");
    return`
    <div class="conv-item" onclick="openChat('${c.userId}','${safeNameAttr}')">
      <div class="conv-avatar">${esc((c.name||'?').charAt(0).toUpperCase())}</div>
      <div class="conv-info">
        <div class="conv-name"><span>${safeName}</span><span style="font-size:0.72em;color:var(--text-dim);font-weight:400">${timeAgo(c.lastMsg.created_at)}</span></div>
        <div class="conv-preview">${esc(c.lastMsg.content||'')}</div>
      </div>
      ${c.unread>0?'<span class="conv-unread"></span>':''}
    </div>`;}).join('');
}

function openChat(userId,name){
  curChatUser={id:userId,name};
  document.getElementById('convList').style.display='none';
  document.getElementById('dmEmpty').style.display='none';
  const chatView=document.getElementById('chatView');
  chatView.style.display='block';
  renderChat();
  markDMsRead(userId);
}

function closeChat(){
  curChatUser=null;
  document.getElementById('chatView').style.display='none';
  document.getElementById('convList').style.display='block';
  renderConvList();
}

function renderChat(){
  if(!curChatUser)return;
  const msgs=allDMs.filter(m=>(m.from_id===curChatUser.id&&m.to_id===curUser.id)||(m.to_id===curChatUser.id&&m.from_id===curUser.id)).reverse();
  const chatView=document.getElementById('chatView');
  chatView.innerHTML=`
    <div class="chat-header">
      <button class="chat-back" onclick="closeChat()">←</button>
      <span class="chat-name">${esc(curChatUser.name)}</span>
    </div>
    <div class="chat-messages" id="chatMsgs">
      ${msgs.length===0?'<div style="text-align:center;color:var(--text-dim);padding:40px 0;font-size:0.85em">开始聊天吧</div>':''}
      ${msgs.map(m=>`<div class="chat-bubble ${m.from_id===curUser.id?'mine':'theirs'}"${m.from_id===curUser.id&&m.id?` onclick="recallDM(${m.id})"`:''}>
        ${m.recalled?'<span style="color:var(--text-dim);font-style:italic">消息已撤回</span>':`${esc(m.content||'')}`}<span class="chat-time">${timeAgo(m.created_at)}${m.from_id===curUser.id&&m.id&&!m.recalled?' · 点击撤回':''}</span></div>`).join('')}
    </div>
    <div class="chat-input-bar">
      <input type="text" id="dmInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendDM()">
      <button class="btn sm pri" onclick="sendDM()">发送</button>
    </div>`;
  const el=document.getElementById('chatMsgs');
  if(el)el.scrollTop=el.scrollHeight;
}

async function sendDM(){
  const inp=document.getElementById('dmInput');if(!inp)return;
  const text=inp.value.trim();if(!text||!curUser||!curChatUser)return;
  const msg={from_id:curUser.id,to_id:curChatUser.id,from_name:curProfile.name,to_name:curChatUser.name,content:text,read:false,created_at:Date.now()};
  allDMs.unshift(msg);inp.value='';renderChat();updateUnreadDot();
  const{error}=await db.from('direct_messages').insert(msg);
  if(error){allDMs=allDMs.filter(x=>x!==msg);renderChat();toast('发送失败');}
  else{await sendNotification(curChatUser.id,'dm',null,curProfile.name+' 给你发了一条私信');}
}

async function recallDM(id){
  if(!confirm('撤回这条消息？'))return;
  const m=allDMs.find(x=>x.id===id);
  if(!m||m.from_id!==curUser.id)return;
  m.recalled=true;m.content='';renderChat();
  const{error}=await db.rpc('recall_dm',{msg_id:id,uid:curUser.id});
  if(error){m.recalled=false;renderChat();toast('撤回失败');}
}

async function markDMsRead(userId){
  const unread=allDMs.filter(m=>m.from_id===userId&&m.to_id===curUser.id&&!m.read);
  unread.forEach(m=>m.read=true);
  updateUnreadDot();
  if(unread.length>0)await db.rpc('mark_dms_read',{sender_id:userId,receiver_id:curUser.id});
}

function openDMFromCard(userId,userName){
  switchPage('msg');
  setTimeout(()=>{switchMsgTab('dm');openChat(userId,userName);},100);
}

// ===== 编辑资料 =====
const AVATARS=['🐱','🐼','🦊','🐰','🐻','🌸','🌙','⭐','🎀','🎵','🌈','🍀','🎂','🔥','💎','🎮','🌻','🍄','🧸','🎯'];
let editAvatar='';

function openEditProfile(){
  editAvatar=curProfile.avatar||'';
  document.getElementById('mTitle').textContent='编辑资料';
  document.getElementById('mBody').innerHTML=`
    <div class="auth-field"><label>昵称</label><input type="text" id="editName" value="${esc(curProfile.name)}" maxlength="20"></div>
    <div style="font-size:0.78em;color:var(--text-sec);margin-bottom:8px">选择头像</div>
    <div class="emoji-grid">${AVATARS.map(e=>`<button class="emoji-opt${editAvatar===e?' on':''}" onclick="pickAvatar(this,'${e}')">${e}</button>`).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn pri" onclick="saveProfile()" style="flex:1">保存</button>
      <button class="btn" onclick="closeModal()" style="flex:1">取消</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}

function pickAvatar(btn,emoji){
  document.querySelectorAll('.emoji-opt').forEach(b=>b.classList.remove('on'));
  if(editAvatar===emoji){editAvatar='';} else{editAvatar=emoji;btn.classList.add('on');}
}

async function saveProfile(){
  const newName=document.getElementById('editName').value.trim();
  if(!newName){toast('昵称不能为空');return;}
  const oldName=curProfile.name;
  const{error}=await db.from('profiles').upsert({user_id:curUser.id,display_name:newName,avatar_emoji:editAvatar,updated_at:Date.now()});
  if(error){console.error('saveProfile error:',error);toast('保存失败：'+error.message);return;}
  curProfile.name=newName;curProfile.avatar=editAvatar;
  document.getElementById('profileName').textContent=newName;
  document.getElementById('avatarChar').textContent=editAvatar||newName.charAt(0).toUpperCase();
  allWishes.forEach(w=>{
    if(w.user_id===curUser.id){w.name=newName;w.user_name=newName;w.user_avatar=editAvatar;}
    if(w.msgs){w.msgs.forEach(m=>{if(m.uid===curUser.id)m.from=newName;});}
  });
  allDMs.forEach(m=>{if(m.from_id===curUser.id)m.from_name=newName;if(m.to_id===curUser.id)m.to_name=newName;});
  allNotifs.forEach(n=>{if(n.from_id===curUser.id)n.from_name=newName;});
  closeModal();toast('资料已更新');render();
  await db.rpc('update_wishes_profile',{uid:curUser.id,new_name:newName,new_avatar:editAvatar});
  await db.rpc('rename_user_everywhere',{uid:curUser.id,new_name:newName});
}

function startRealtime(){
  if(window._realtimeSub)return;
  window._realtimeSub=db.channel('sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'wishes'},()=>loadAll())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+curUser.id},()=>loadNotifs())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages'},()=>loadDMs())
    .subscribe();
}

// ===== 启动 =====
renderTags();
checkSession();
</script>
